spring.application.name=ecoportal

# --- PostgreSQL (змінні оточення з дефолтами) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecoportal}
spring.datasource.username=${DB_USER:ecoportal}
spring.datasource.password=${DB_PASSWORD:ecoportal}

# --- Ініціалізація БД ідемпотентними скриптами schema.sql та data.sql ---
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# --- JPA: схему створюють SQL-скрипти, Hibernate лише перевіряє ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Cookie-сесія ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# --- Кодування та JSON ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.jackson.default-property-inclusion=always

# Автентифікація власна (сесії + BCrypt), тому стандартний користувач Spring Boot не потрібен
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
